shamefullyHoist: true
# vite dev 预打包（optimizeDeps）以裸包名从项目根解析 mermaid 的传递依赖
# （dayjs/cytoscape/debug 等），pnpm 严格隔离布局不提升传递依赖会解析失败；
# 提升到根 node_modules 恢复可达（docs 站点场景无严格隔离诉求）

allowBuilds:
  # esbuild: tsx 依赖，postinstall 安装平台二进制
  esbuild: true
  # puppeteer: postinstall 仅下载自带 Chrome（约 150MB），
  # PDF 导出通过 config.json chrome.executablePath 使用系统 Chrome，无需下载
  puppeteer: false
